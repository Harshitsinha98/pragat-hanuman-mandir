<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>संपर्क करें - श्री प्रगट हनुमान जी देवस्थानम्</title>
    <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <style>
        /* Desktop features control */
        .mobile-audio-li { display: none !important; }

        /* Mobile Specific Overwrite Rules with Absolute Priority */
        @media (max-width: 768px) {
            header {
                display: flex !important;
                flex-direction: row !important;
                justify-content: space-between !important;
                align-items: center !important;
                padding: 12px 20px !important;
            }

            /* Desktop widgets hide on phone */
            .desktop-audio-widget { display: none !important; }
            .mobile-audio-li { display: block !important; margin-bottom: 10px; }

            /* Inside Mobile Menu Audio Button Styling */
            #audio-control-widget-mobile {
                background: linear-gradient(135deg, #ff6600, #ff9933);
                color: white !important;
                padding: 12px 20px;
                border-radius: 25px;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 10px;
                font-size: 15px;
                font-weight: bold;
                cursor: pointer;
                box-shadow: 0 4px 12px rgba(255, 102, 0, 0.3);
            }

            /* FORCE HAMBURGER VISIBILITY */
            .hamburger {
                display: flex !important;
                flex-direction: column !important;
                justify-content: center !important;
                gap: 5px !important;
                background: transparent !important;
                border: none !important;
                cursor: pointer !important;
                padding: 8px !important;
                z-index: 10005 !important;
                width: 40px;
                height: 40px;
            }

            .hamburger span {
                display: block !important;
                width: 26px !important;
                height: 3px !important;
                background-color: #ffffff !important;
                border-radius: 3px !important;
                transition: transform 0.3s ease, opacity 0.3s ease !important;
            }

            /* Cross (X) Animation Overwrites */
            .hamburger.active span:nth-child(1) {
                transform: translateY(8px) rotate(45deg) !important;
            }
            .hamburger.active span:nth-child(2) {
                opacity: 0 !important;
            }
            .hamburger.active span:nth-child(3) {
                transform: translateY(-8px) rotate(-45deg) !important;
            }

            /* Responsive Drawer Containers layout */
            #navLinks {
                display: flex !important;
                flex-direction: column !important;
                position: fixed !important;
                top: 0 !important;
                right: -100% !important; 
                width: 70% !important; 
                height: 100vh !important;
                background-color: #2b1810 !important;
                padding: 110px 24px 24px 24px !important;
                box-shadow: -8px 0 25px rgba(0,0,0,0.6) !important;
                z-index: 10001 !important;
                gap: 15px !important;
                transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1) !important;
            }

            #navLinks.active {
                right: 0 !important;
            }

            #navLinks li {
                width: 100% !important;
                margin-left: 0 !important;
                list-style: none !important;
            }

            #navLinks li a {
                display: block !important;
                font-size: 16px !important;
                color: #FFFFFF !important;
                padding: 12px 0 !important;
                text-decoration: none !important;
                border-bottom: 1px solid rgba(255, 102, 0, 0.12) !important;
            }

            .nav-donate-btn {
                background-color: #ff6600 !important;
                color: white !important;
                text-align: center !important;
                border-radius: 25px !important;
                padding: 12px !important;
                margin-top: 10px !important;
                border-bottom: none !important;
            }
        }
    </style>
</head>
<body>

    <header>
        <audio id="bgAudio" loop>
            <source src="images/hanuman-chalisa.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>

        <div id="audio-control-widget" class="desktop-audio-widget" onclick="toggleAudio()">
            <span id="audio-icon">🎵</span>
            <span id="audio-text">हनुमान चालीसा</span>
        </div>

        <a href="index.html" class="logo-link">
            <div class="logo-container">
                <img src="images/logo.png" alt="Mandir Logo" class="mandir-logo">
                <div class="logo-text-group">
                    <span class="logo-text">प्रगट हनुमानजी</span>
                    <span class="logo-sub">देवस्थानम्, सूखी सेवनिया</span>
                </div>
            </div>
        </a>

        <nav>
            <button class="hamburger" id="hamburgerBtn" aria-label="Menu" style="display: none;">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <ul id="navLinks">
